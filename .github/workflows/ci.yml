name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: flutter build apk --debug --flavor demo --dart-define=SUBAKO_FIREBASE_ENABLED=false
      - uses: actions/upload-artifact@v4
        with:
          name: SUBAKO-Demo-APK
          path: build/app/outputs/flutter-apk/app-demo-debug.apk

  functions:
    name: Functions typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  iot-bridge:
    name: IoT bridge typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-run/iot-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud-run/iot-bridge/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  firebase-emulators:
    name: Firestore Rules and trusted workflow integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run test:rules
      - run: npm run test:backend
