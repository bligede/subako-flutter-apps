name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  flutter:
    name: Flutter format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  functions:
    name: Functions typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  iot-bridge:
    name: IoT bridge typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-run/iot-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cloud-run/iot-bridge/package-lock.json
      - run: npm ci
      - run: npm run typecheck
