name: subako
description: SUBAKO — Smart Irrigation Management Platform untuk Subak (Android, Firebase, Gemini).
publish_to: "none"
version: 0.2.2+4

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8

  # Firebase platform
  firebase_core: 5.1.0
  firebase_auth: 7.0.1
  cloud_firestore: 7.1.0
  firebase_messaging: 17.0.1
  firebase_app_check: 0.5.1
  firebase_storage: 14.0.1
  firebase_crashlytics: 6.0.1
  firebase_remote_config: 7.0.1
  cloud_functions: 7.0.1

  # Gemini melalui Firebase AI Logic (tanpa API key di aplikasi)
  firebase_ai: 5.1.0

  # State, routing, UI
  flutter_riverpod: 3.5.0
  go_router: 18.1.3
  fl_chart: 1.3.0
  intl: 0.20.3
  collection: 1.19.1
  crypto: 3.0.8
  shared_preferences: 2.5.6
  flutter_secure_storage: 11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
